<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>面部特写检查</title>
<style>
  * { margin:0; padding:0; }
  body { background:#151024; }
  canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="screen" width="1400" height="1240"></canvas>
<script src="../js/audio.js"></script>
<script src="../js/characters.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/effects.js"></script>
<script>
(function () {
  var ctx = document.getElementById('screen').getContext('2d');
  var all = window.COMPOSERS;
  var cols = 7, cellW = 200, cellH = 150;
  var SCALE = 3.0;

  ctx.fillStyle = '#151024';
  ctx.fillRect(0, 0, 1400, 1240);

  for (var i = 0; i < all.length; i++) {
    var c = all[i];
    var col = i % cols, row = (i / cols) | 0;
    var x = 20 + col * cellW, y = 20 + row * cellH;

    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(x, y, cellW - 12, cellH - 12);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.strokeRect(x + 0.5, y + 0.5, cellW - 13, cellH - 13);

    // 放大后把“头部”对准取景框中心
    ctx.save();
    ctx.beginPath();
    ctx.rect(x + 6, y + 6, cellW - 22, cellH - 40);
    ctx.clip();
    ctx.translate(x + (cellW - 12) / 2 - 6, y + 66);
    ctx.scale(SCALE, SCALE);
    window.Sprites.draw(ctx, { composer: c, state: 'idle', tick: 0, facing: 'right', scale: 1 }, 0, 100);
    ctx.restore();

    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 13px Consolas, monospace';
    ctx.fillText(c.name, x + 8, y + cellH - 26);
    var f = c.sprite.face;
    ctx.fillStyle = '#7ee0c0';
    ctx.font = '10px Consolas, monospace';
    ctx.fillText(c.sprite.hair + ' / ' + f.shape + ' / ' + f.eyes, x + 8, y + cellH - 14);
    ctx.fillStyle = '#9c94a8';
    ctx.fillText(f.brows + ' / ' + f.nose + ' / ' + f.mouth, x + 8, y + cellH - 4);
  }
  document.title = 'face-sheet-ready';
})();
</script>
</body>
</html>
