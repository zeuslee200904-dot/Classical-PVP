<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>精灵表检查</title>
<style>
  * { margin:0; padding:0; }
  body { background:#151024; }
  canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="screen" width="1200" height="1930"></canvas>
<script src="../js/audio.js"></script>
<script src="../js/characters.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/effects.js"></script>
<script>
(function () {
  var ctx = document.getElementById('screen').getContext('2d');
  var states = ['idle0', 'walk0', 'punch1', 'kick1', 'guard0', 'guardHit0', 'field1', 'echo1', 'cast1'];
  var ids = ['beethoven', 'mozart', 'hildegard', 'chopin', 'verdi', 'strauss',
             'bach', 'vivaldi', 'paganini', 'britten', 'joplin', 'takemitsu'];
  var cellW = 128, cellH = 104;

  ctx.fillStyle = '#151024';
  ctx.fillRect(0, 0, 1200, 760);

  // 网格与参考线
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  for (var r = 0; r <= ids.length; r++) {
    ctx.beginPath(); ctx.moveTo(0, 40 + r * cellH); ctx.lineTo(1200, 40 + r * cellH); ctx.stroke();
  }
  for (var c = 0; c <= states.length; c++) {
    ctx.beginPath(); ctx.moveTo(90 + c * cellW, 0); ctx.lineTo(90 + c * cellW, 760); ctx.stroke();
  }

  // 表头
  ctx.fillStyle = '#ffd479';
  ctx.font = '13px Consolas, monospace';
  for (var s = 0; s < states.length; s++) {
    ctx.fillText(states[s], 96 + s * cellW, 24);
  }

  for (var i = 0; i < ids.length; i++) {
    var comp = window.COMPOSER_BY_ID[ids[i]];
    var baseY = 40 + (i + 1) * cellH - 16;
    // 地面线（脚底基准）
    ctx.strokeStyle = 'rgba(255,120,120,0.55)';
    ctx.beginPath(); ctx.moveTo(0, baseY); ctx.lineTo(1200, baseY); ctx.stroke();

    ctx.fillStyle = '#cfc7b0';
    ctx.font = '12px Consolas, monospace';
    ctx.fillText(comp.en + ' ' + comp.tags.era + '/' + comp.tags.region, 6, baseY - 60);

    for (var k = 0; k < states.length; k++) {
      // 前 5 列朝右（左方角色），后 4 列朝左（右方角色）
      var facing = k < 5 ? 'right' : 'left';
      var cx = 90 + k * cellW + cellW / 2;
      window.Sprites.draw(ctx, {
        composer: comp,
        state: states[k].replace(/\d$/, ''),
        tick: parseInt(states[k].slice(-1), 10) * 6,
        facing: facing,
        scale: 1.0
      }, cx, baseY);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText(facing === 'right' ? '→' : '←', cx + 60, baseY - 4);
    }
  }

  // 全部 50 位作曲家的待机姿势
  var all = window.COMPOSERS;
  var rowH = 108;
  var galleryTop = 40 + ids.length * cellH + 54;
  for (var m = 0; m < all.length; m++) {
    var gx = 40 + (m % 7) * 165;
    var gy = galleryTop + ((m / 7) | 0) * rowH;
    window.Sprites.draw(ctx, { composer: all[m], state: 'idle', tick: 0, facing: 'right', scale: 0.56 }, gx + 20, gy);
    ctx.fillStyle = '#4ee0b0';
    ctx.fillRect(gx - 16, gy - 66, 6, 10);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(gx - 8, gy - 66, 6, 10);
    ctx.fillStyle = '#9c94a8';
    ctx.font = '11px Consolas, monospace';
    ctx.fillText(all[m].name, gx - 16, gy - 50);
    ctx.fillStyle = '#5b5470';
    ctx.font = '10px Consolas, monospace';
    ctx.fillText(all[m].tags.era + '·' + all[m].tags.region, gx - 16, gy + 16);
  }
  document.title = 'sprite-sheet-ready';
})();
</script>
</body>
</html>
