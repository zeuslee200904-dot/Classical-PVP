<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古典作曲家 大乱斗 · CLASSIC COMPOSERS BATTLE</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="screen" width="960" height="540"></canvas>
  </div>
  <div id="helpbar">
    <span class="kb">I</span>上 <span class="kb">J</span>左 <span class="kb">K</span>下 <span class="kb">L</span>右
    <span class="sep">|</span>
    <span class="kb">A</span>挥拳 <span class="kb">D</span>踢腿
    <span class="kb">Q</span>技能1 <span class="kb">W</span>技能2 <span class="kb">E</span>终极技
    <span class="kb">S</span>格挡（按住）
    <span class="sep">|</span>
    <span class="kb">R</span>重新开始 <span class="kb">O</span>设置 <span class="kb">M</span>静音
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/characters.js"></script>
<script src="js/sprites.js"></script>
<script src="js/effects.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
