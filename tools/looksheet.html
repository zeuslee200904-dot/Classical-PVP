<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>v5.1 造型对照表</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #6e7480; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="screen" width="1620" height="2420"></canvas>
<script src="../js/audio.js"></script>
<script src="../js/characters.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/effects.js"></script>
<script>
(function () {
  var ctx = document.getElementById('screen').getContext('2d');
  var W = 1620, H = 2420;
  // 用中间调底色：本项目里最深的袍色明度只有 ~18%，画在深底上会看不见剪影
  ctx.fillStyle = '#6e7480';
  ctx.fillRect(0, 0, W, H);
  var INK = '#1a1e26';

  function label(text, x, y, size, color, align) {
    ctx.font = (size || 12) + 'px "Microsoft YaHei", Consolas, monospace';
    ctx.fillStyle = color || INK;
    ctx.textAlign = align || 'left';
    ctx.fillText(text, x, y);
  }
  function section(title, sub, y) {
    ctx.fillStyle = INK;
    ctx.fillRect(24, y - 22, 5, 26);
    label(title, 40, y, 20, '#12161c');
    label(sub, 40 + ctx.measureText(title).width + 240, y, 12, '#3a424e');
  }
  function cellBg(x, y, w, h, alt) {
    ctx.fillStyle = alt ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.10)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(30,34,42,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }
  function ground(x1, x2, y) {
    ctx.strokeStyle = 'rgba(30,34,42,0.40)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
  }
  function copySprite(src) {
    var o = {};
    for (var k in src) o[k] = src[k];
    return o;
  }

  // =========================================================
  //  A. 七十五人总览
  // =========================================================
  section('七十五位作曲家 · 造型总览', '每格：序号 / 姓名 / 袍服款式 / 手持物 / 帽子 / 发型', 44);
  var COLS = 10, CW = 156, CH = 176, X0 = 24, Y0 = 62;
  for (var i = 0; i < window.COMPOSERS.length; i++) {
    var c = window.COMPOSERS[i];
    var cx = X0 + (i % COLS) * CW, cy = Y0 + Math.floor(i / COLS) * CH;
    cellBg(cx + 3, cy + 3, CW - 6, CH - 6, i % 2 === 0);
    ground(cx + 12, cx + CW - 12, cy + 118);
    window.Sprites.draw(ctx, {
      composer: c, state: 'idle', tick: (i % 3) * 7, facing: 'right', scale: 0.9
    }, cx + CW / 2, cy + 118);
    label((i + 1) + '. ' + c.name, cx + CW / 2, cy + 136, 13, '#12161c', 'center');
    label(c.sprite.coatStyle + ' · ' + c.sprite.item, cx + CW / 2, cy + 151, 10.5, '#153a56', 'center');
    label((c.sprite.hat || '无帽') + ' · ' + c.sprite.hair, cx + CW / 2, cy + 164, 10.5, '#4a1f4a', 'center');
  }
  var yA = Y0 + Math.ceil(window.COMPOSERS.length / COLS) * CH + 34;

  function pick(pred) {
    for (var k = 0; k < window.COMPOSERS.length; k++) if (pred(window.COMPOSERS[k])) return window.COMPOSERS[k];
    return window.COMPOSERS[0];
  }
  function countBy(pred) {
    var n = 0;
    for (var q = 0; q < window.COMPOSERS.length; q++) if (pred(window.COMPOSERS[q])) n++;
    return n;
  }

  // =========================================================
  //  B. 十种袍服款式（剥掉帽子/手持物/挂件，只看衣服本身）
  // =========================================================
  var STYLES = ['frock', 'tailed', 'habit', 'gown', 'military', 'doublet', 'jacket', 'sweater', 'kimono', 'tunic'];
  section('十种袍服剪影', '统一剥掉帽子 / 手持物 / 挂件，只比较衣服本身的轮廓', yA);
  var yB = yA + 18, SW = 156, SH = 190;
  var base = window.COMPOSER_BY_ID['beethoven'];
  for (var s = 0; s < STYLES.length; s++) {
    var st = STYLES[s];
    var who = pick(function (c) { return c.sprite.coatStyle === st; });
    var sx = X0 + s * SW;
    cellBg(sx + 3, yB, SW - 6, SH - 6, s % 2 === 0);
    ground(sx + 12, sx + SW - 12, yB + 126);
    // 用"贝多芬的体型 + 该款式的代表配色"，避免体型差异干扰轮廓比较
    var sp = copySprite(base.sprite);
    sp.coatStyle = st;
    sp.coat = who.sprite.coat.slice();
    sp.hat = null; sp.item = null; sp.cape = false; sp.scarf = false; sp.sash = false;
    sp.beard = false; sp.mustache = false; sp.glasses = false; sp.monocle = false; sp.pipe = false;
    sp.stoop = 0; sp.height = 1; sp.bulk = 1;
    window.Sprites.draw(ctx, {
      composer: { sprite: sp }, state: 'idle', tick: 0, facing: 'right', scale: 1.0
    }, sx + SW / 2, yB + 126);
    label(st, sx + SW / 2, yB + 148, 13, '#12161c', 'center');
    label('例：' + who.name, sx + SW / 2, yB + 164, 10.5, '#333a46', 'center');
    label(countBy(function (c) { return c.sprite.coatStyle === st; }) + ' 人', sx + SW / 2, yB + 178, 10.5, '#0f4438', 'center');
  }
  var yC = yB + SH + 34;

  // =========================================================
  //  C. 十五种手持物
  // =========================================================
  var ITEMS = ['baton', 'violin', 'flute', 'trumpet', 'lute', 'lyre', 'quill', 'scroll',
    'fan', 'watch', 'book', 'wineglass', 'metronome', 'cane', 'organ'];
  section('十五种手持物', '统一用贝多芬的体型与配色，只换 item 字段；用 cast 姿势让手臂抬起', yC);
  var yD = yC + 18, IW = 106, IH = 172;
  for (var it = 0; it < ITEMS.length; it++) {
    var ix = X0 + it * IW;
    cellBg(ix + 3, yD, IW - 6, IH - 6, it % 2 === 0);
    ground(ix + 8, ix + IW - 8, yD + 120);
    var sp2 = copySprite(base.sprite);
    sp2.item = ITEMS[it]; sp2.hat = null; sp2.cape = false; sp2.scarf = false; sp2.sash = false;
    sp2.beard = false; sp2.mustache = false; sp2.glasses = false; sp2.monocle = false; sp2.pipe = false;
    window.Sprites.draw(ctx, {
      composer: { sprite: sp2 }, state: 'cast', tick: 0, facing: 'right', scale: 0.86
    }, ix + IW / 2, yD + 120);
    label(ITEMS[it], ix + IW / 2, yD + 140, 11.5, '#153a56', 'center');
    label(countBy(function (c) { return c.sprite.item === ITEMS[it]; }) + ' 人', ix + IW / 2, yD + 156, 10.5, '#0f4438', 'center');
  }
  var yE = yD + IH + 34;

  // =========================================================
  //  D. 十种帽子
  // =========================================================
  var HATS = ['tricorne', 'bicorne', 'tophat', 'flatcap', 'mortarboard', 'beret', 'hood', 'wreath', 'straw', 'nightcap'];
  section('十种帽子', '统一用贝多芬的体型与短发，只换 hat 字段', yE);
  var yF = yE + 18, HW = 156, HH = 172;
  for (var h = 0; h < HATS.length; h++) {
    var hx = X0 + h * HW;
    cellBg(hx + 3, yF, HW - 6, HH - 6, h % 2 === 0);
    ground(hx + 12, hx + HW - 12, yF + 120);
    var sp3 = copySprite(base.sprite);
    sp3.hat = HATS[h]; sp3.item = null;
    sp3.hair = 'short'; sp3.hairColor = '#6a5a48'; sp3.hairDark = '#3a2f22';
    sp3.beard = false; sp3.mustache = false; sp3.glasses = false; sp3.monocle = false; sp3.pipe = false;
    sp3.cape = false; sp3.scarf = false; sp3.sash = false;
    window.Sprites.draw(ctx, {
      composer: { sprite: sp3 }, state: 'idle', tick: 0, facing: 'right', scale: 1.0
    }, hx + HW / 2, yF + 120);
    label(HATS[h], hx + HW / 2, yF + 140, 12, '#4a1f4a', 'center');
    label(countBy(function (c) { return c.sprite.hat === HATS[h]; }) + ' 人', hx + HW / 2, yF + 156, 10.5, '#0f4438', 'center');
  }
  var yG = yF + HH + 32;

  // =========================================================
  //  E. 躯干挂件 / 驼背 / 面部小配件
  // =========================================================
  section('躯干挂件 · 驼背程度 · 面部配件', 'cape 披风 / scarf 围巾 / sash 绶带 / stoop 0-1-2 / monocle · pipe · earring', yG);
  var yH = yG + 18, VW = 156, VH = 178;
  var VARIANTS = [
    ['无挂件', {}, 0],
    ['披风 cape', { cape: true }, 0],
    ['围巾 scarf', { scarf: true }, 0],
    ['绶带 sash', { sash: true }, 0],
    ['驼背 stoop 0', {}, 0],
    ['驼背 stoop 1', {}, 1],
    ['驼背 stoop 2', {}, 2],
    ['单片眼镜 monocle', { monocle: true }, 0],
    ['烟斗 pipe', { pipe: true }, 0],
    ['耳环 earring', { earring: true }, 0]
  ];
  for (var v = 0; v < VARIANTS.length; v++) {
    var vx = X0 + v * VW;
    cellBg(vx + 3, yH, VW - 6, VH - 6, v % 2 === 0);
    ground(vx + 12, vx + VW - 12, yH + 124);
    var sp4 = copySprite(base.sprite);
    sp4.item = null; sp4.hat = null;
    sp4.cape = false; sp4.scarf = false; sp4.sash = false;
    sp4.monocle = false; sp4.pipe = false; sp4.earring = false;
    sp4.beard = false; sp4.mustache = false; sp4.glasses = false;
    sp4.hair = 'short'; sp4.hairColor = '#6a5a48'; sp4.hairDark = '#3a2f22';
    for (var k6 in VARIANTS[v][1]) sp4[k6] = VARIANTS[v][1][k6];
    sp4.stoop = VARIANTS[v][2];
    window.Sprites.draw(ctx, {
      composer: { sprite: sp4 }, state: 'idle', tick: 0, facing: 'right', scale: 1.0
    }, vx + VW / 2, yH + 124);
    label(VARIANTS[v][0], vx + VW / 2, yH + 146, 12, '#12161c', 'center');
  }

  label('古典作曲家 大乱斗 · Version 5.1 造型对照表', 24, H - 16, 14, '#20242c');
  label('共 ' + window.COMPOSERS.length + ' 位 · 10 种袍服 · 15 种手持物 · 10 种帽子 · 19 种发型 · 一人一色',
    W - 24, H - 16, 14, '#20242c', 'right');
  window.__LOOKSHEET_DONE = true;
})();
</script>
</body>
</html>
